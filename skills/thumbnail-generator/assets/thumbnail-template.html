<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thumbnail Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 32px;
      font-family: -apple-system, sans-serif;
    }

    .scale-wrap {
      transform: scale(0.70);
      transform-origin: top center;
      margin-bottom: -224px;
    }

    .thumbnail {
      position: relative;
      width: 1280px;
      height: 720px;
      background: [BG_COLOR];
      overflow: hidden;
    }

    /* Depth vignette — does not compete with text or face */
    .thumbnail::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 90% at 25% 50%, transparent 40%, rgba(0,0,0,0.35) 100%),
        linear-gradient(to right, rgba(0,0,0,0.15) 0%, transparent 45%);
      z-index: 3;
      pointer-events: none;
    }

    .text-area {
      position: absolute;
      left: [TEXT_LEFT];
      top: 50%;
      transform: translateY(-50%);
      width: [TEXT_WIDTH];
      z-index: 4;
    }

    .title {
      font-family: [FONT_FAMILY], Georgia, serif;
      font-size: [FONT_SIZE]px;
      font-weight: [FONT_WEIGHT];
      color: [TEXT_COLOR];
      line-height: 1.02;
      letter-spacing: -0.5px;
      word-break: keep-all;
    }

    /* Only include if subtitle is needed. Minimum effective size: 42px. */
    .subtitle {
      font-family: [FONT_FAMILY], Georgia, serif;
      font-size: 42px;
      font-weight: 400;
      color: [TEXT_COLOR];
      opacity: 0.65;
      margin-top: 18px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .person {
      position: absolute;
      right: 0;
      top: [FACE_TOP];
      height: [FACE_HEIGHT];
      width: auto;
      max-width: 60%;
      z-index: 2;
      object-fit: cover;
      object-position: top center;
    }

    .instructions {
      color: #444;
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
      margin-top: 32px;
    }
    .instructions strong { color: #666; }
  </style>
</head>
<body>

  <div class="scale-wrap">
    <div class="thumbnail">

      <div class="text-area">
        <div class="title">[LINE_1]<br>[LINE_2]</div>
        <!-- <div class="subtitle">[SUBTITLE]</div> -->
      </div>

      <!--
        PHOTO BLEND NOTES:
        Dark/transparent bg → mix-blend-mode: normal
        Light/studio bg     → mix-blend-mode: luminosity
        Never exceed brightness 1.10 or contrast 1.15 — eyes must stay visible
      -->
      <img
        class="person"
        src="[PHOTO_SRC]"
        alt=""
        style="mix-blend-mode: [BLEND_MODE]; filter: brightness([BRIGHTNESS]) contrast([CONTRAST]);"
      />

    </div>
  </div>

  <p class="instructions">
    <strong>To export:</strong> Right-click → save as image, or screenshot.<br>
    Rendered at <strong>1280 × 720px</strong> (YouTube standard). Scale wrapper is display-only.
  </p>

</body>
</html>
